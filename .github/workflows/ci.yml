name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Release runs the same checks on the tagged commit before it builds anything.
  workflow_call:

# A newer push to the same branch makes an unfinished run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16, master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache key ignores the image version; C objects built on a newer
          # glibc must not reach an older image.
          key: ${{ matrix.os }}
      # Hosted runners start clean every time; the .deb files of the players and
      # their libraries are kept in the Actions cache instead of being downloaded again.
      # vlc-bin and vlc-plugin-base are VLC without its window: enough for the tests,
      # which run it with the dummy interface and the Lua module. yt-dlp resolves links
      # for VLC (the tests serve a clip locally). mesa-vulkan-drivers brings lavapipe, a
      # software Vulkan for the UI snapshot tests: the runners have no GPU.
      # The image's package lists go stale (the mirror drops superseded versions) and the
      # action does not refresh them before a clean install, which then fails quietly.
      - name: Refresh the package lists
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq
      - name: Install mpv and VLC
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: mpv vlc-bin vlc-plugin-base yt-dlp mesa-vulkan-drivers
          version: ${{ matrix.os }}-5
          execute_install_scripts: true
      # The player tests skip themselves without the players, so a failed install must
      # fail here instead of passing unnoticed.
      - name: Check the players
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mpv --version | sed -n 1p
          vlc --version 2>/dev/null | sed -n 1p
          yt-dlp --version
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        # All failures at once: a platform-only failure must not hide the next one.
        run: cargo test --workspace --all-features --no-fail-fast
      # The executables must not need the Visual C++ Redistributable (.cargo/config.toml).
      - name: Check the Windows executables' DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p sppy-app -p sppy-server-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          foreach ($exe in "target\debug\sppy.exe", "target\debug\sppy-server.exe") {
            $deps = & $dumpbin /nologo /dependents $exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $deps | Select-String "\.dll"
            # A list without the system DLLs means the output was not read correctly.
            if (-not ($deps -match "kernel32")) { throw "no DLL list for $exe" }
            if ($deps -match "vcruntime|msvcp") { throw "$exe needs the Visual C++ Redistributable" }
          }
