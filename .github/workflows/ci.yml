name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key ignores the image version; C objects built on a newer
          # glibc must not reach an older image.
          key: ${{ matrix.os }}
      # Hosted runners start clean every time; the .deb files of mpv and its
      # libraries are kept in the Actions cache instead of being downloaded again.
      - name: Install mpv
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: mpv
          version: ${{ matrix.os }}-1
          execute_install_scripts: true
      - name: Check mpv
        if: runner.os == 'Linux'
        run: mpv --version | head -1
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
