name: Release

# Tag vX.Y.Z to publish a release; run manually to only build the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag can be pushed before CI on its commit has finished, or on a commit CI never
  # saw; nothing is built or published unless the checks pass on exactly this commit.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: the binary then runs on older glibc too.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16, master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache key ignores the image version; C objects built on a newer
          # glibc must not reach an older image.
          key: ${{ matrix.os }}
      - name: Build
        run: cargo build --profile dist --locked -p sppy-app -p sppy-server-cli
      # The app and the headless server are separate downloads: most people want only
      # the app (it hosts by itself), a server machine wants only the server.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          for bin in sppy sppy-server; do
            name="$bin-$ref-${{ matrix.platform }}"
            mkdir "$name"
            cp "target/dist/$bin" README.md LICENSE-MIT LICENSE-APACHE "$name/"
            tar czf "$name.tar.gz" "$name"
          done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          foreach ($bin in "sppy", "sppy-server") {
            $name = "$bin-$ref-${{ matrix.platform }}"
            New-Item -ItemType Directory $name | Out-Null
            Copy-Item "target/dist/$bin.exe", README.md, LICENSE-MIT, LICENSE-APACHE $name
            Compress-Archive -Path $name -DestinationPath "$name.zip"
          }
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WiX 5: WiX 6 and later ask projects for a maintenance fee.
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { throw "could not install WiX" }
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'sppy-app').version
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          $msi = "sppy-$ref-${{ matrix.platform }}.msi"
          & $wix build bins/app/installer/sppy.wxs -arch x64 -d "Version=$version" `
            -d "RepoDir=$PWD" -d "BinDir=$PWD\target\dist" -o $msi
          if ($LASTEXITCODE) { throw "wix build failed" }
          "MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Install, look, uninstall: the MSI is only ever built here, so this is its test.
      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Run-Msiexec($arguments) {
            $p = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content msiexec.log -Tail 40 -ErrorAction SilentlyContinue
              throw "msiexec $arguments exited with $($p.ExitCode)"
            }
          }
          # Installed products with the UpgradeCode of bins/app/installer/sppy.wxs.
          function Installed-Count {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $codes = $installer.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null,
              $installer, @('{66964DF3-D4C0-4C4A-A321-A77892016211}'))
            @($codes).Count
          }
          $exe = "$env:LOCALAPPDATA\Programs\sppy\sppy.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\sppy.lnk"
          # An older version first, so that the real MSI has to upgrade it. It is built
          # outside the workspace so that it is not uploaded with the release files.
          $old = "$env:RUNNER_TEMP\sppy-0.0.1.msi"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build bins/app/installer/sppy.wxs -arch x64 `
            -d "Version=0.0.1" -d "RepoDir=$PWD" -d "BinDir=$PWD\target\dist" -o $old
          if ($LASTEXITCODE) { throw "wix build failed" }
          Run-Msiexec "/i `"$old`" /qn /l*v msiexec.log"
          if ((Installed-Count) -ne 1) { throw "the old version is not installed" }
          Run-Msiexec "/i `"$env:MSI`" /qn /l*v msiexec.log"
          if ((Installed-Count) -ne 1) { throw "$(Installed-Count) sppy installs after upgrading" }
          if (-not (Test-Path $exe)) { throw "sppy.exe was not installed" }
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $exe) { throw "the shortcut points to $target" }
          Run-Msiexec "/x `"$env:MSI`" /qn /l*v msiexec.log"
          if ((Installed-Count) -ne 0) { throw "sppy is still installed" }
          if (Test-Path $exe) { throw "sppy.exe is still there after uninstalling" }
          if (Test-Path $lnk) { throw "the Start menu shortcut is still there" }
          if (Test-Path (Split-Path $exe)) { throw "the install folder is still there" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            *.zip
            sppy-*.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "sppy $GITHUB_REF_NAME"
          --generate-notes
