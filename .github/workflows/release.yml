name: Release

# Tag vX.Y.Z to publish a release; run manually to only build the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag can be pushed before CI on its commit has finished, or on a commit CI never
  # saw; nothing is built or published unless the checks pass on exactly this commit.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: the binary then runs on older glibc too.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16, master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache key ignores the image version; C objects built on a newer
          # glibc must not reach an older image.
          key: ${{ matrix.os }}
      - name: Build
        run: cargo build --profile dist --locked -p sppy-app -p sppy-server-cli
      # The app and the headless server are separate downloads: most people want only
      # the app (it hosts by itself), a server machine wants only the server.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          for bin in sppy sppy-server; do
            name="$bin-$ref-${{ matrix.platform }}"
            mkdir "$name"
            cp "target/dist/$bin" README.md LICENSE-MIT LICENSE-APACHE "$name/"
            tar czf "$name.tar.gz" "$name"
          done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          foreach ($bin in "sppy", "sppy-server") {
            $name = "$bin-$ref-${{ matrix.platform }}"
            New-Item -ItemType Directory $name | Out-Null
            Copy-Item "target/dist/$bin.exe", README.md, LICENSE-MIT, LICENSE-APACHE $name
            Compress-Archive -Path $name -DestinationPath "$name.zip"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "sppy $GITHUB_REF_NAME"
          --generate-notes
